# Build the kernel, run the kernel test suites plus the ring-3
# fork→exec→wait smoke test (issue #374) headlessly in QEMU, and lint.
# The UEFI loader is built from UchLoaderPkg with EDK2 and cached; the cache
# is only invalidated when UchLoaderPkg/ or the pinned EDK2 tag changes.
name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  EDK2_TAG: edk2-stable202405

jobs:
  build-test-lint:
    name: Build / QEMU tests / clang-tidy
    # Back on ubuntu-latest (QEMU 8.2, exception delivery matching real
    # hardware) now that #383 and #384 are fixed: this runner is the
    # regression net for the fault-handler alignment fix, which the 22.04
    # QEMU (6.2) cannot exercise. The #385 BAR placement is still worked
    # around via fw_cfg in scripts/run_kernel_tests.sh; #388 stays open.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm clang lld clang-tidy qemu-system-x86 ovmf mtools dosfstools
        curl -L https://github.com/uchan-nos/mikanos-build/releases/download/v2.0/x86_64-elf.tar.gz -o x86_64-elf.tar.gz
        tar -xzf x86_64-elf.tar.gz

    - name: Cache UEFI loader
      id: cache-loader
      uses: actions/cache@v4
      with:
        path: Loader.efi
        key: loader-${{ env.EDK2_TAG }}-${{ hashFiles('UchLoaderPkg/**') }}

    - name: Build UEFI loader
      if: steps.cache-loader.outputs.cache-hit != 'true'
      run: |
        sudo apt-get install -y build-essential uuid-dev python3 python-is-python3
        git clone --depth 1 --branch "$EDK2_TAG" https://github.com/tianocore/edk2.git "$HOME/edk2"
        cd "$HOME/edk2"
        # Keep submodules minimal: BaseTools needs brotli, and MdePkg.dec
        # references the mipisyst include directory.
        git submodule update --init --depth 1 \
            BaseTools/Source/C/BrotliCompress/brotli \
            MdePkg/Library/MipiSysTLib/mipisyst
        make -C BaseTools -j"$(nproc)"
        ln -s "$GITHUB_WORKSPACE/UchLoaderPkg" UchLoaderPkg
        source edksetup.sh
        build -p UchLoaderPkg/UchLoaderPkg.dsc -b RELEASE -a X64 -t GCC
        cp Build/UchLoaderPkgX64/RELEASE_GCC/X64/Loader.efi "$GITHUB_WORKSPACE/Loader.efi"

    - name: Configure CMake
      run: |
        cmake -S kernel -B build \
              -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DKERNEL_TESTS=ON \
              -DKERNEL_TEST_EXIT=ON \
              -DKERNEL_SMOKE_TEST=ON \
              -DKERNEL_HEAP_DEBUG=ON

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}}

    # The ring-3 smoke test (issue #374) boots into userland: the shell and
    # the echo child it runs must be on the virtio-blk storage disk.
    - name: Build userland smoke binaries
      run: |
        export CPPFLAGS="-I$GITHUB_WORKSPACE/x86_64-elf/include/c++/v1 -I$GITHUB_WORKSPACE/x86_64-elf/include \
        -nostdlibinc -D__ELF__ -D_LDBL_EQ_DBL -D_GNU_SOURCE -D_POSIX_TIMERS"
        export LDFLAGS="-L$GITHUB_WORKSPACE/x86_64-elf/lib"
        make -C userland/shell shell
        make -C userland/commands/echo echo
        make -C userland/services/pongd pongd

    - name: Run kernel tests and ring-3 smoke test in QEMU
      run: |
        chmod +x ./scripts/run_kernel_tests.sh
        WORK_DIR=qemu-test \
        SMOKE_BINS="userland/shell/shell userland/commands/echo/echo userland/services/pongd/pongd" \
        ./scripts/run_kernel_tests.sh

    - name: Upload serial log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-test-serial-log
        path: |
          qemu-test/serial.log
          qemu-test/qemu-debug.log
        if-no-files-found: ignore

    # The -d int trace names raw addresses; symbolizing them needs the exact
    # binaries this run booted (local rebuilds differ by compiler version).
    - name: Upload booted binaries for symbolization
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-debug-binaries
        path: |
          build/UchosKernel
          userland/shell/shell
          userland/commands/echo/echo
          userland/services/pongd/pongd
        if-no-files-found: ignore

    - name: Run clang-tidy
      run: |
        chmod +x ./lint.sh
        OUTPUT=$(./lint.sh)
        echo "$OUTPUT"
        if echo "$OUTPUT" | grep -E "warning:|error:"; then
          echo "clang-tidy found warnings or errors"
          exit 1
        fi
